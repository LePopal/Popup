name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            rid: win-x64
          - os: macos-latest
            platform: osx
            arch: x64
            rid: osx-x64
          - os: macos-latest
            platform: osx
            arch: arm64
            rid: osx-arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            rid: linux-x64

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      shell: bash

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Updater.Core
      run: dotnet build src/Popup.Updater.Core/Popup.Updater.Core.csproj -c Release --no-restore

    - name: Build Updater.Launcher
      run: dotnet publish src/Popup.Updater.Launcher/Popup.Updater.Launcher.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish/launcher

    - name: Build Popup
      run: dotnet publish src/Popup/Popup.csproj -c Release -r ${{ matrix.rid }} --self-contained false -o ./publish/app

    - name: Copy Updater to app directory
      shell: bash
      run: |
        if [ "${{ matrix.platform }}" == "win" ]; then
          cp ./publish/launcher/Popup.Updater.Launcher.exe ./publish/app/
        else
          cp ./publish/launcher/Popup.Updater.Launcher ./publish/app/
          chmod +x ./publish/app/Popup.Updater.Launcher
        fi

    - name: Create ZIP archive
      shell: bash
      run: |
        cd ./publish/app
        if [ "${{ matrix.platform }}" == "win" ]; then
          7z a ../../Popup-v${{ steps.get_version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip *
        else
          zip -r ../../Popup-v${{ steps.get_version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip *
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Popup-${{ matrix.platform }}-${{ matrix.arch }}
        path: Popup-v${{ steps.get_version.outputs.VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release v${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          ./artifacts/**/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}